name: Source and static validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Reconcile Excel and validate PBIP definitions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_HOME: ${{ github.workspace }}/.tools/dotnet
      NUGET_PACKAGES: ${{ github.workspace }}/.tools/nuget
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-analysis.txt

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements-analysis.txt

      - name: Restore TMDL parser dependencies
        run: dotnet restore scripts/tmdl-check/TmdlCheck.csproj

      - name: Recalculate source and validate PBIP / TMDL / PBIR
        run: python scripts/run_validation.py --fresh

      - name: Keep diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-static-validation-${{ github.run_id }}
          path: |
            evidence/validation/validation-run.json
            evidence/validation/final-tom.json
            evidence/validation/model-checks.json
            evidence/validation/report-checks.json
            evidence/validation/final-json-schema.json
            evidence/validation/project-integrity.json
            .cache/validation/
          if-no-files-found: warn
          retention-days: 7
